<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Inside the Information Security Policy</title>
<style>
  :root {
    --bg:        #0d0d0f;
    --panel:     #16161a;
    --ink:       #f0efe9;
    --ink-soft:  #b5b3a9;
    --ink-faint: #6a6862;
    --rule:      #2a2a2e;
    --rule-soft: #1f1f22;

    --col-a:       #4c9aff;          /* AUP: brand blue */
    --col-a-soft:  #1a2a44;
    --col-b:       #2ecc71;          /* ISP: emerald */
    --col-b-soft:  #143a24;
    --col-bridge:  #d4a256;          /* Bridge: rich antique gold */
    --col-bridge-soft:#3a2d18;
    --col-solo:    #2ecc71;
    --col-solo-soft: #143a24;

    --edge:        #3a3a3d;
    --edge-a:      #6cb1ff;
    --edge-b:      #5dd88c;
    --edge-bridge: #e1b878;
    --edge-solo:   #5dd88c;

    --serif:     "Iowan Old Style","Charter","Georgia","Cambria",ui-serif,serif;
    --sans:      "Inter","Helvetica Neue",-apple-system,BlinkMacSystemFont,Arial,sans-serif;
    --mono:      "SF Mono","Menlo","Monaco",ui-monospace,monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Top bar: slim header with eyebrow + at-a-glance stats. Stays out of the way. */
  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 18px 8px;
    border-bottom: 1px solid var(--rule);
    background: var(--panel);
    gap: 18px;
    min-height: 34px;
    flex-wrap: wrap;
  }
  .topbar .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .14em;
    color: #ffffff;
    white-space: nowrap;
  }
  .topbar .eyebrow .accent { color: var(--col-solo); font-weight: 600; }
  .topbar .eyebrow .accent.a { color: var(--col-a); }
  .topbar .eyebrow .accent.b { color: var(--col-b); }
  .topbar .topstats {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: #ffffff;
    letter-spacing: .02em;
  }
  .topbar .topstats .stat b {
    color: #ffffff;
    font-weight: 600;
    margin-right: 4px;
  }
  .topbar .topstats .stat.solo b { color: var(--col-solo); }
  .topbar .topstats .stat.a b { color: var(--col-a); }
  .topbar .topstats .stat.b b { color: var(--col-b); }
  .topbar .topstats .stat.bridge b { color: var(--col-bridge); }
  .topbar .topstats .sep { color: var(--ink-faint); opacity: .6; }

  /* Default: graph fills full width; side panel is collapsed.
     When a concept is focused (.has-focus on <main>), panel slides in. */
  main { flex: 1; display: grid; grid-template-columns: 1fr 0px; min-height: 0;
         transition: grid-template-columns .28s cubic-bezier(.2,.7,.2,1); }
  main.has-focus { grid-template-columns: 1fr 360px; }
  #stage {
    position: relative;
    background: radial-gradient(ellipse 70% 80% at 50% 50%, rgba(46,204,113,.11) 0%, transparent 70%), var(--bg);
    overflow: hidden;
  }
  #graph { width: 100%; height: 100%; display: block; }

  /* zone labels (only used in connection mode) */
  .zone-label {
    position: absolute; top: 14px;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .14em;
    color: var(--ink-faint);
    pointer-events: none;
  }
  .zone-label.a { left: 24px; color: var(--col-a); opacity: .8; }
  .zone-label.b { right: 24px; color: var(--col-b); opacity: .8; }
  .zone-label.bridge { left: 50%; transform: translateX(-50%); color: var(--col-bridge); }

  .legend {
    position: absolute;
    left: 24px; bottom: 22px;
    background: rgba(22,22,26,.82);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 12px 14px;
    font-size: 11px;
    color: var(--ink-soft);
    line-height: 1.5;
    pointer-events: none;
    backdrop-filter: blur(6px);
    max-width: 290px;
  }
  .legend .row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .legend .row:last-child { margin-bottom: 0; }
  .legend .swatch {
    width: 10px; height: 10px; border-radius: 50%;
  }
  .legend .swatch.a       { background: var(--col-a); }
  .legend .swatch.b       { background: var(--col-b); }
  .legend .swatch.bridge  { background: var(--col-bridge); }
  .legend .swatch.solo    { background: var(--col-solo); }
  .legend .swatch.backbone{ background: linear-gradient(90deg, var(--col-bridge) 0%, var(--col-bridge) 100%); height: 3px; border-radius: 2px; width: 18px; }

  .controls {
    position: absolute;
    right: 18px; top: 44px;   /* clears the zone-label row in connection mode */
    display: flex; flex-direction: column; gap: 8px;
    align-items: flex-end;
  }
  .search {
    background: rgba(22,22,26,.92);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 7px 10px;
    font-family: var(--sans);
    font-size: 12px;
    width: 220px;
    color: var(--ink);
    outline: none;
  }
  .search:focus { border-color: var(--col-bridge); }
  .reset {
    background: var(--ink);
    color: var(--bg);
    border: 0; border-radius: 4px;
    padding: 5px 11px;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .08em;
    cursor: pointer;
    opacity: 0;
    transition: opacity .2s;
  }
  .reset.show { opacity: 1; }
  .toggle {
    background: rgba(22,22,26,.92);
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    border-radius: 4px;
    padding: 5px 11px;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .08em;
    cursor: pointer;
  }
  .toggle.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* Predicate filter chips: the killer feature.
     Shows the top verbs as clickable chips. Click one -> only those edges remain.
     This is what makes the Binding property of the ontology immediately readable. */
  .chips-wrap {
    position: absolute;
    right: 18px;
    top: 152px;             /* sits below search + 2 toggles */
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
    max-width: 290px;
  }
  .chips-wrap .chips-label {
    font-family: var(--mono);
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--ink-faint);
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: flex-end;
  }
  .chip {
    background: rgba(22,22,26,.92);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 3px 9px 3px 9px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 11.5px;
    color: var(--ink-soft);
    cursor: pointer;
    line-height: 1.2;
    transition: background .12s, color .12s, border-color .12s;
    white-space: nowrap;
  }
  .chip .ct {
    font-family: var(--mono);
    font-style: normal;
    font-size: 9.5px;
    color: var(--ink-faint);
    margin-left: 5px;
  }
  .chip:hover { border-color: var(--col-bridge); color: var(--ink); }
  .chip.on {
    background: var(--col-bridge);
    border-color: var(--col-bridge);
    color: #fff;
  }
  .chip.on .ct { color: rgba(255,255,255,.85); }

  /* side panel: collapsed by default, slides in on focus */
  aside {
    border-left: 1px solid var(--rule);
    background: var(--panel);
    padding: 26px 28px 36px;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 0;
    opacity: 0;
    transition: opacity .2s ease .04s;
  }
  main.has-focus aside { opacity: 1; }
  /* When collapsed, hide all internal padding so nothing peeks out */
  main:not(.has-focus) aside { padding: 0; border-left: 0; }
  .ptitle {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--ink-faint);
    margin-bottom: 8px;
  }
  aside h2 {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 500;
    margin: 0 0 8px;
    line-height: 1.25;
    letter-spacing: -.005em;
  }
  .sidechip {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .1em;
    padding: 3px 8px;
    border-radius: 3px;
    margin-right: 6px;
    color: #fff;
  }
  .sidechip.a { background: var(--col-a); }
  .sidechip.b { background: var(--col-b); }
  .sidechip.bridge { background: var(--col-bridge); }
  .sidechip.solo { background: var(--col-solo); }
  .meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    margin-bottom: 18px;
  }
  .meta b.a { color: var(--col-a); }
  .meta b.b { color: var(--col-b); }
  .meta b.solo { color: var(--col-solo); }
  .section {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--rule-soft);
  }
  .section h3 {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--ink-faint);
    margin: 0 0 10px;
    font-weight: 600;
  }
  .qlist { display: flex; flex-direction: column; gap: 8px; }
  .qrow {
    display: grid; grid-template-columns: 18px 1fr; gap: 10px;
    font-family: var(--serif); font-size: 13.5px; color: var(--ink-soft);
    line-height: 1.45;
  }
  .qrow .dot {
    width: 6px; height: 6px; border-radius: 50%;
    margin-top: 7px;
  }
  .qrow .dot.a { background: var(--col-a); }
  .qrow .dot.b { background: var(--col-b); }
  .qrow .dot.solo { background: var(--col-solo); }

  .preds-box {
    display: flex; flex-direction: column; gap: 4px;
  }
  .predrow {
    font-family: var(--serif);
    font-size: 13px;
    color: var(--ink-soft);
    padding: 4px 0;
    line-height: 1.4;
  }
  .predrow .arrow { color: var(--ink-faint); font-family: var(--mono); }
  .predrow b { color: var(--ink); font-weight: 600; }
  .predrow .pred {
    color: var(--col-bridge);
    font-style: italic;
    font-family: var(--serif);
  }
  .predrow .weight {
    color: var(--ink-faint);
    font-family: var(--mono);
    font-size: 10px;
  }

  /* edge tooltip */
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: #08080a;
    color: var(--ink);
    border: 1px solid var(--rule);
    padding: 11px 13px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.45;
    max-width: 380px;
    box-shadow: 0 6px 24px rgba(0,0,0,.55);
    opacity: 0;
    transition: opacity .12s;
    z-index: 50;
  }
  .tooltip.show { opacity: 1; }
  .tooltip .tt-pred {
    font-family: var(--serif);
    font-size: 13px;
    font-style: italic;
    color: #ffb98a;
    margin-bottom: 6px;
  }
  .tooltip .tt-meta {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: #ffb98a;
    margin-bottom: 6px;
  }
  .tooltip .tt-pair {
    font-family: var(--serif);
    font-size: 13px;
    margin-bottom: 8px;
  }
  .tooltip .tt-pair em { color: #ffb98a; font-style: normal; font-weight: 500; }
  .tooltip ul { margin: 4px 0 0; padding: 0 0 0 14px; color: #ddd; }
  .tooltip ul li { margin-bottom: 3px; font-size: 11.5px; line-height: 1.4; }

  /* svg styles */
  .edge {
    fill: none;
    stroke: var(--edge);
    stroke-opacity: .5;
    transition: stroke .15s, stroke-opacity .15s, stroke-width .15s;
  }
  .edge.a       { stroke: var(--edge-a);      stroke-opacity: .55; }
  .edge.b       { stroke: var(--edge-b);      stroke-opacity: .55; }
  .edge.bridge  { stroke: var(--edge-bridge); stroke-opacity: .7; }
  .edge.solo    { stroke: var(--edge-solo);   stroke-opacity: .55; }
  .edge.backbone { stroke-opacity: .9; }
  .edge.dim     { stroke-opacity: .07; }
  .edge.focus   { stroke-opacity: 1; stroke-width: 2.5px; }

  .arrowhead { fill: var(--edge); }
  .arrowhead.a { fill: var(--edge-a); }
  .arrowhead.b { fill: var(--edge-b); }
  .arrowhead.bridge { fill: var(--edge-bridge); }
  .arrowhead.solo { fill: var(--edge-solo); }

  .node circle {
    stroke: none;
    stroke-width: 0;
    cursor: pointer;
    transition: opacity .15s, stroke .15s, stroke-width .15s;
  }
  .node.a       circle { fill: var(--col-a); }
  .node.b       circle { fill: var(--col-b); }
  .node.bridge  circle { fill: var(--col-bridge); }
  .node.solo    circle { fill: var(--col-solo); }
  .node.dim     circle { opacity: .12; }
  .node.focus   circle { stroke: var(--ink); stroke-width: 3px; }

  .node text {
    font-family: var(--serif);
    font-size: 11.5px;
    fill: var(--ink);
    pointer-events: none;
    user-select: none;
    text-anchor: middle;
    dominant-baseline: middle;
    stroke: none;
    opacity: 0;
    transition: opacity .12s;
  }
  .node text.show { opacity: 1; }
  .node.dim text { opacity: .12 !important; }
  .node.focus text { opacity: 1 !important; font-weight: 600; }
  .node.bridge text.show { font-weight: 500; }
  .node:hover text { opacity: 1; }

  .edge-label {
    font-family: var(--serif);
    font-size: 10.5px;
    font-style: italic;
    fill: var(--ink-faint);
    text-anchor: middle;
    pointer-events: none;
    stroke: none;
    opacity: 0;
    transition: opacity .15s;
  }
  .edge-label.show { opacity: 1; fill: var(--col-bridge); }
  .edge-label.alwaysShow { opacity: 1; }

  @media (max-width: 1100px) {
    main, main.has-focus { grid-template-columns: 1fr; grid-template-rows: 1fr 0px; }
    main.has-focus { grid-template-rows: 1fr 360px; }
    aside { border-left: 0; }
    main.has-focus aside { border-top: 1px solid var(--rule); max-height: 380px; }
  }
</style>
</head>

  const leanOf = (d) => {

  const nodeSel = gNodes.selectAll("g.node")
    .data(DATA.nodes, d => d.id)
    .join("g")
    .attr("class", d => "node " + d.uiSide)
    .call(d3.drag()
      .on("start", (ev, d) => { if (!ev.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag",  (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
      .on("end",   (ev, d) => { if (!ev.active) sim.alphaTarget(0); }))
    .on("click", (ev, d) => { ev.stopPropagation(); focusNode(d); });

  nodeSel.append("circle").attr("r", d => r(sizeOf(d)));

  // Always-on labels: enough to read the hubs at a glance, not so many that
  // they pile up. In connection mode, label only the top-N bridge concepts
  // (by total topic count) instead of every bridge: 87 bridge labels were
  // creating a wall of text.
  const sortedSize = DATA.nodes.slice().sort((a,b) => sizeOf(b) - sizeOf(a));
  const LABEL_TOP_N = MODE === "solo" ? 30 : 14;
  const labelAlways = new Set(sortedSize.slice(0, LABEL_TOP_N).map(n => n.id));
  if (MODE === "connection") {
    const bridges = DATA.nodes.filter(n => n.is_bridge || n.side === "BRIDGE");
    bridges.sort((a,b) => sizeOf(b) - sizeOf(a));
    bridges.slice(0, 16).forEach(n => labelAlways.add(n.id));
  }

  nodeSel.append("text")
    .attr("dy", d => -(r(sizeOf(d)) + 7))
    .text(d => d.id)
    .classed("show", d => labelAlways.has(d.id));

  // tick
  sim.on("tick", () => {
    edgeSel.attr("d", d => {
      const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
      const dr = Math.hypot(dx, dy) * 1.7;
      const tr = r(sizeOf(d.target)) + 4;
      const ang = Math.atan2(dy, dx);
      const tx = d.target.x - Math.cos(ang) * tr;
      const ty = d.target.y - Math.sin(ang) * tr;
      return `M${d.source.x},${d.source.y}A${dr},${dr} 0 0,1 ${tx},${ty}`;
    });
    labelSel
      .attr("x", d => (d.source.x + d.target.x) / 2)
      .attr("y", d => (d.source.y + d.target.y) / 2 - 4);
    nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
  });

  // zoom / pan / clear
  svg.call(d3.zoom().scaleExtent([0.4, 4]).on("zoom", ev => zoomG.attr("transform", ev.transform)));
  svg.on("click", () => clearFocus());

  let focused = null;
  function focusNode(d) {
    focused = d.id;
    const ins  = inEdges.get(d.id)  || [];
    const outs = outEdges.get(d.id) || [];
    const nbr = new Set();
    ins.forEach(e => nbr.add(e.f));
    outs.forEach(e => nbr.add(e.t));
    nbr.add(d.id);
    nodeSel.classed("dim",   n => !nbr.has(n.id))
           .classed("focus", n => n.id === d.id);
    edgeSel.classed("dim",   e => e.source.id !== d.id && e.target.id !== d.id)
           .classed("focus", e => e.source.id === d.id || e.target.id === d.id);
    labelSel.classed("show", e => e.source.id === d.id || e.target.id === d.id);
    renderPanel(d);
    resetBtn.classList.add("show");
    // Slide the panel in. Only re-flow the simulation if width actually changed.
    if (!mainEl.classList.contains("has-focus")) {
      mainEl.classList.add("has-focus");
      // Wait for the CSS grid transition to finish, then re-measure & re-flow.
      setTimeout(() => {
        W = stage.clientWidth; H = stage.clientHeight;
        svg.attr("viewBox", [0, 0, W, H]);
        sim.alpha(0.25).restart();
      }, 320);
    }
  }
  function clearFocus() {
    focused = null;
    nodeSel.classed("dim", false).classed("focus", false);
    edgeSel.classed("dim", false).classed("focus", false);
    labelSel.classed("show", false).classed("alwaysShow", allOn || (MODE === "connection" ? null : false));
    if (MODE === "connection") {
      labelSel.classed("alwaysShow", d => d.edge.backbone || allOn);
    }
    // Also clear any active chip filter (single source of truth on background click).
    document.querySelectorAll(".chip.on").forEach(c => c.classList.remove("on"));
    renderEmpty();
    resetBtn.classList.remove("show");
    search.value = "";
    if (mainEl.classList.contains("has-focus")) {
      mainEl.classList.remove("has-focus");
      setTimeout(() => {
        W = stage.clientWidth; H = stage.clientHeight;
        svg.attr("viewBox", [0, 0, W, H]);
        sim.alpha(0.25).restart();
      }, 320);
    }
  }
  resetBtn.addEventListener("click", clearFocus);

  let allOn = false;
  toggleBtn.addEventListener("click", () => {
    allOn = !allOn;
    toggleBtn.classList.toggle("on", allOn);
    toggleBtn.textContent = allOn ? "Hide predicates" : "Show predicates";
    labelSel.classed("alwaysShow", allOn || backboneAlwaysOn);
  });

  // ---- predicate filter chips ---------------------------------------------
  // In connection mode we always show backbone edge predicates by default:
  // they are the structural claim of that view (relationships shared by both
  // policies). Users can still "Show all" via the toggle.
  const backboneAlwaysOn = (MODE === "connection");
  if (backboneAlwaysOn) {
    labelSel.classed("alwaysShow", d => d.edge.backbone);
  }

  // Tally predicates across the graph and render the top-N as chips.
  const predCounts = new Map();
  DATA.edges.forEach(e => {
    const p = prettyPred(e.p);
    if (!p) return;
    predCounts.set(p, (predCounts.get(p) || 0) + 1);
  });
  const topPreds = Array.from(predCounts.entries())
    .sort((a, b) => b[1] - a[1])
    .slice(0, 7);

  const chipsEl = document.getElementById("chips");
  const chipsWrap = document.getElementById("chips-wrap");
  if (!topPreds.length) {
    chipsWrap.style.display = "none";
  } else {
    let activePred = null;
    topPreds.forEach(([pred, n]) => {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.innerHTML = `${escapeHtml(pred)}<span class="ct">${n}</span>`;
      chip.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (activePred === pred) {
          activePred = null;
          document.querySelectorAll(".chip.on").forEach(c => c.classList.remove("on"));
          edgeSel.classed("dim", false);
          labelSel.classed("show", false).classed("alwaysShow", allOn || backboneAlwaysOn);
          nodeSel.classed("dim", false);
        } else {
          activePred = pred;
          document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === chip));
          // Highlight only edges with this predicate; dim nodes that touch none.
          const liveNodes = new Set();
          edgeSel.classed("dim", e => prettyPred(e.edge.p) !== pred);
          labelSel.classed("show", e => prettyPred(e.edge.p) === pred).classed("alwaysShow", false);
          DATA.edges.forEach(e => {
            if (prettyPred(e.p) === pred) { liveNodes.add(e.f); liveNodes.add(e.t); }
          });
          nodeSel.classed("dim", n => !liveNodes.has(n.id));
        }
      });
      chipsEl.appendChild(chip);
    });
  }

  function renderEmpty() {
    panel.innerHTML = "";
  }

  function renderPanel(d) {
    const isSolo = MODE === "solo";
    let sideLabel, sideClass;
    if (isSolo)                       { sideLabel = SOLO_LABEL; sideClass = "solo"; }
    else if (d.uiSide === "a")        { sideLabel = POL_A;      sideClass = "a"; }
    else if (d.uiSide === "b")        { sideLabel = POL_B;      sideClass = "b"; }
    else                              { sideLabel = "Bridge concept"; sideClass = "bridge"; }

    const ins  = (inEdges.get(d.id)  || []).slice().sort((a,b) => b.weight - a.weight);
    const outs = (outEdges.get(d.id) || []).slice().sort((a,b) => b.weight - a.weight);
    const totalRel = ins.length + outs.length;

    let outHtml = "";
    if (outs.length) {
      outHtml = `<div class="section"><h3>Outgoing &middot; ${outs.length}</h3><div class="preds-box">` +
        outs.map(e => `<div class="predrow"><b>${escapeHtml(d.id)}</b> <span class="pred">${escapeHtml(prettyPred(e.p))}</span> <b>${escapeHtml(e.t)}</b></div>`).join("") +
        `</div></div>`;
    }
    let inHtml = "";
    if (ins.length) {
      inHtml = `<div class="section"><h3>Incoming &middot; ${ins.length}</h3><div class="preds-box">` +
        ins.map(e => `<div class="predrow"><b>${escapeHtml(e.f)}</b> <span class="pred">${escapeHtml(prettyPred(e.p))}</span> <b>${escapeHtml(d.id)}</b></div>`).join("") +
        `</div></div>`;
    }

    panel.innerHTML = `
      <div class="ptitle">Focused concept</div>
      <h2>${escapeHtml(d.id)}</h2>
      <div><span class="sidechip ${sideClass}">${escapeHtml(sideLabel)}</span></div>
      <div class="meta" style="margin-top:10px">${totalRel} relationship${totalRel === 1 ? "" : "s"}</div>
      ${outHtml}
      ${inHtml}`;
  }
  renderEmpty();

  search.addEventListener("input", () => {
    const q = search.value.trim().toLowerCase();
    if (!q) { if (!focused) clearFocus(); return; }
    const match = DATA.nodes.find(n => n.id.toLowerCase().includes(q));
    if (match) focusNode(match);
  });

  function showTip(ev, d) {
    const e = d.edge;
    let sideLbl;
    if (MODE === "solo")               sideLbl = SOLO_LABEL;
    else if (e.uiSide === "a")         sideLbl = POL_A;
    else if (e.uiSide === "b")         sideLbl = POL_B;
    else if (e.backbone)               sideLbl = "In both policies";
    else                               sideLbl = "Bridge";
    tip.innerHTML = `
      <div class="tt-pair"><em>${escapeHtml(e.f)}</em> &nbsp;<span class="tt-pred">${escapeHtml(prettyPred(e.p))}</span>&nbsp; <em>${escapeHtml(e.t)}</em></div>
      <div class="tt-meta">${sideLbl}</div>
    `;
    tip.classList.add("show");
    moveTip(ev);
  }
  function moveTip(ev) {
    const rb = stage.getBoundingClientRect();
    const x = ev.clientX - rb.left + 14;
    const y = ev.clientY - rb.top + 14;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    const cx = Math.min(x, rb.width  - tw - 8);
    const cy = Math.min(y, rb.height - th - 8);
    tip.style.transform = `translate(${cx}px,${cy}px)`;
  }
  function hideTip() { tip.classList.remove("show"); }

  function truncate(s, n) {
    if (!s) return "";
    s = s.replace(/\s+/g, " ").trim();
    return s.length > n ? s.slice(0, n - 1).trim() + "\u2026" : s;
  }
  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  window.addEventListener("resize", () => {
    W = stage.clientWidth; H = stage.clientHeight;
    svg.attr("viewBox", [0, 0, W, H]);
    sim.force("x", d3.forceX(d => sideX(d)).strength(d => MODE === "solo" ? 0.06 : (d.uiSide === "bridge" ? 0.10 : 0.32)));
    sim.force("y", d3.forceY(H / 2).strength(0.05));
    sim.alpha(0.3).restart();
  });
</script>
</body>
</html>
